name: Android CD - GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is empty. Skipping release keystore setup."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "::error::release-keystore.jks is empty after base64 decoding! Verify RELEASE_KEYSTORE_BASE64."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEY_ALIAS or RELEASE_KEYSTORE_PASSWORD is missing in GitHub Secrets!"
            exit 1
          fi

          cat <<EOF > keystore.properties
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename Release APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd app/build/outputs/apk/release
          if [ -f "app-release.apk" ]; then
            mv app-release.apk "Notification_Saver_${VERSION}.apk"
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          name: Notification Saver ${{ github.ref_name }}
          body: "Official Release of Notification Saver ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
